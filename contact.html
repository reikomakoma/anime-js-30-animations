<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - anime.js 30アニメーション完全解説</title>
    <meta name="description" content="anime.js 30アニメーション完全解説へのお問い合わせ。ご質問・誤情報のご指摘・コンテンツリクエストなどお気軽にどうぞ。" />
    <meta property="og:title" content="お問い合わせ - anime.js 30アニメーション完全解説" />
    <meta property="og:description" content="ご質問・誤情報のご指摘・コンテンツリクエストはこちらからどうぞ。" />
    <meta property="og:image" content="https://statuesque-blancmange-6afb8c.netlify.app/og-image.png" />
    <meta property="og:url" content="https://statuesque-blancmange-6afb8c.netlify.app/contact.html" />
    <link rel="canonical" href="https://statuesque-blancmange-6afb8c.netlify.app/contact.html" />
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-page {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-page h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            color: #fff;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body data-theme="dark">
    <div class="contact-page">
        <a href="index.html" class="back-home">← 戻る</a>
        <h1>お問い合わせ</h1>

        <!-- 送信完了メッセージ（初期非表示） -->
        <div id="successMsg"
            style="display:none;text-align:center;padding:32px 20px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:12px;margin-bottom:20px;">
            <div style="font-size:2.5rem;margin-bottom:16px;">✅</div>
            <h2 style="color:#10b981;font-size:1.2rem;margin-bottom:8px;">送信完了しました！</h2>
            <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:16px;">
                お問い合わせいただきありがとうございます。<br>内容を確認の上、ご連絡いたします（通常3営業日以内）。</p>
            <a href="index.html" style="color:#6366f1;font-weight:600;text-decoration:none;">← ホームへ戻る</a>
        </div>

        <!-- Netlify Forms対応フォーム -->
        <form id="contactForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" novalidate>
            <!-- honeypot（スパム対策・非表示） -->
            <div style="display:none;" aria-hidden="true">
                <label>Don't fill this out if you're human: <input name="bot-field"></label>
            </div>
            <input type="hidden" name="form-name" value="contact" />

            <div class="form-group">
                <label for="name">お名前 <span style="color:#f87171;">*</span></label>
                <input type="text" id="name" name="name" required placeholder="山田 太郎" autocomplete="name">
                <span class="field-error" id="nameError"
                    style="display:none;color:#f87171;font-size:0.8rem;margin-top:4px;"></span>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス <span style="color:#f87171;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com"
                    autocomplete="email">
                <span class="field-error" id="emailError"
                    style="display:none;color:#f87171;font-size:0.8rem;margin-top:4px;"></span>
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容 <span style="color:#f87171;">*</span></label>
                <textarea id="message" name="message" rows="5" required placeholder="メッセージを入力してください"></textarea>
                <span class="field-error" id="messageError"
                    style="display:none;color:#f87171;font-size:0.8rem;margin-top:4px;"></span>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">送信する</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const successMsg = document.getElementById('successMsg');

        function showError(inputId, errorId, msg) {
            document.getElementById(errorId).style.display = 'block';
            document.getElementById(errorId).textContent = msg;
            document.getElementById(inputId).style.borderColor = '#f87171';
        }
        function clearError(inputId, errorId) {
            document.getElementById(errorId).style.display = 'none';
            document.getElementById(inputId).style.borderColor = '';
        }

        // リアルタイムバリデーション
        document.getElementById('name').addEventListener('blur', () => {
            const v = document.getElementById('name').value.trim();
            if (!v) showError('name', 'nameError', 'お名前を入力してください');
            else clearError('name', 'nameError');
        });
        document.getElementById('email').addEventListener('blur', () => {
            const v = document.getElementById('email').value.trim();
            const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!v) showError('email', 'emailError', 'メールアドレスを入力してください');
            else if (!emailRe.test(v)) showError('email', 'emailError', '正しいメールアドレスを入力してください');
            else clearError('email', 'emailError');
        });
        document.getElementById('message').addEventListener('blur', () => {
            const v = document.getElementById('message').value.trim();
            if (!v) showError('message', 'messageError', 'お問い合わせ内容を入力してください');
            else clearError('message', 'messageError');
        });

        // フォーム送信
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            let valid = true;
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!name) { showError('name', 'nameError', 'お名前を入力してください'); valid = false; }
            if (!emailRe.test(email)) { showError('email', 'emailError', '正しいメールアドレスを入力してください'); valid = false; }
            if (!message) { showError('message', 'messageError', 'お問い合わせ内容を入力してください'); valid = false; }
            if (!valid) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '送信中...';
            btn.style.opacity = '0.7';

            try {
                const formData = new FormData(form);
                await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(formData).toString() });
                form.style.display = 'none';
                successMsg.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                btn.disabled = false;
                btn.textContent = '送信する';
                btn.style.opacity = '1';
                alert('送信に失敗しました。ネットワーク接続を確認して再試行してください。');
            }
        });
    </script>
  <script src="./global-nav.js"></script>
</body>

</html>
