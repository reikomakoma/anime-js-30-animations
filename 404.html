<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>404 - ページが見つかりません | anime.js 30アニメーション完全解説</title>
    <meta name="description" content="お探しのページが見つかりませんでした。ホームやサイトマップから目的のページをお探しください。" />
    <link rel="canonical" href="https://statuesque-blancmange-6afb8c.netlify.app/404" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pages.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>

<body data-theme="dark">
    <div class="not-found-page">
        <div class="not-found-code" id="notFoundCode">404</div>
        <h1 class="not-found-title">ページが見つかりません</h1>
        <p class="not-found-desc">
            お探しのページは移動・削除されたか、URLが間違っている可能性があります。<br>
            ホームページやサイトマップからお目当てのコンテンツをお探しください。
        </p>
        <div class="not-found-links">
            <a href="index.html" class="btn btn-primary">🏠 ホームへ戻る</a>
            <a href="sitemap.html" class="btn btn-secondary">🗺️ サイトマップ</a>
            <a href="blog/index.html" class="btn btn-secondary">📚 Blogを見る</a>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <div class="footer-logo">anime.js <span>30 Animations</span></div>
            <nav class="footer-nav" aria-label="フッターナビゲーション">
                <div class="footer-nav-group">
                    <span class="group-label">コンテンツ</span>
                    <a href="index.html">ホーム（30デモ）</a>
                    <a href="blog/index.html">Blog</a>
                    <a href="guides/timing-easing.html">Guides</a>
                    <a href="changelog.html">更新履歴</a>
                </div>
                <div class="footer-nav-group">
                    <span class="group-label">サイト情報</span>
                    <a href="about.html">運営者情報</a>
                    <a href="contact.html">お問い合わせ</a>
                    <a href="sitemap.html">サイトマップ</a>
                    <a href="faq.html">FAQ</a>
                </div>
                <div class="footer-nav-group">
                    <span class="group-label">ポリシー</span>
                    <a href="terms.html">利用規約</a>
                    <a href="disclaimer.html">免責事項</a>
                    <a href="cookie.html">Cookie ポリシー</a>
                    <a href="advertising.html">広告配信について</a>
                    <a href="privacy.html">プライバシーポリシー</a>
                </div>
            </nav>
            <p class="footer-copy">&copy; 2026 anime.js 30アニメーション完全解説 by rei</p>
        </div>
    </footer>

    <script>
        // 404コードにアニメーション（Reduced Motion対応）
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReduced) {
            anime({
                targets: '#notFoundCode',
                scale: [0.8, 1],
                opacity: [0, 1],
                duration: 800,
                easing: 'easeOutBack'
            });
            // 浮かび上がるアニメーション
            anime({
                targets: '.not-found-title, .not-found-desc, .not-found-links',
                translateY: [20, 0],
                opacity: [0, 1],
                delay: anime.stagger(100, { start: 400 }),
                duration: 600,
                easing: 'easeOutCubic'
            });
        }
    </script>
  <script src="./global-nav.js"></script>
</body>

</html>
